services:
  slack-app:
    build: .
    image: metamark-agency:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
    volumes:
      - ./.governed_memory:/app/.governed_memory
      - ./audit_logs:/app/audit_logs
      - ./campaign_data:/app/campaign_data
      - ./generated_assets:/app/generated_assets
