display_information:
  name: Manifest AI
  description: Research-backed Facebook campaigns through a conversation with Manifest AI.
  background_color: "#111111"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Manifest AI
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - files:write
      - im:history
      - im:read
      - im:write
      - groups:history
settings:
  event_subscriptions:
    request_url: https://c8c2-207-160-169-39.ngrok-free.app/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://c8c2-207-160-169-39.ngrok-free.app/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
